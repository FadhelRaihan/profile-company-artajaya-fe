[pytest]
# Custom markers
markers =
    smoke: Critical smoke tests (run first)
    validation: Validation tests
    integration: Integration tests
    slow: Slow running tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*[!Page]*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --disable-warnings

# Logging
log_cli = false
log_cli_level = INFO

norecursedirs =
    .* 
    build
    dist
    node_modules
    venv
    env
    __pycache__
    $RECYCLE.BIN
    System Volume Information
    WindowsApps
    Config.Msi
    WpSystem

    